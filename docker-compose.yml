# ==================================================================
# ACTION Platform - Docker Compose
# ==================================================================
# Deploys the ENTIRE stack on a fresh server with ONLY Docker.
#
# What gets installed automatically:
#   1. Ollama (LLM inference server)
#   2. MedGemma model (pulled on first start, model set via MEDGEMMA_MODEL env var)
#   3. FastAPI backend + all Python dependencies
#
# Usage:
#   docker-compose up --build        (first time / after code changes)
#   docker-compose up -d             (detached / production mode)
#   docker-compose logs -f           (watch logs)
#   docker-compose down              (stop everything)
#
# First start takes ~5 min (model download). Subsequent starts: ~10s.
# Model weights persist in a Docker volume across restarts / upgrades.
# ==================================================================

services:

  # ----------------------------------------------------------------
  # Ollama - Local LLM server (installs + runs + pulls model)
  # ----------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: action-platform-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Keep only one model loaded at a time to conserve RAM.
      - OLLAMA_MAX_LOADED_MODELS=1
      # Only one concurrent inference request on a CPU-only instance.
      - OLLAMA_NUM_PARALLEL=1
      # Flash-attention halves the KV-cache footprint (~10-15% RAM saving).
      - OLLAMA_FLASH_ATTENTION=1
    restart: unless-stopped
    # No mem_limit here — Ollama gets all remaining host RAM.
    logging:
      driver: gcplogs
      options:
        gcp-log-cmd: "true"       # include the container command in the log entry
        labels: service=ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ----------------------------------------------------------------
  # Model puller - one-shot job that ensures MedGemma is downloaded
  # ----------------------------------------------------------------
  model-puller:
    image: ollama/ollama:latest
    container_name: action-platform-model-puller
    mem_limit: 256m   # Just a shell script — needs almost no RAM.
    environment:
      - OLLAMA_HOST=http://action-platform-ollama:11434
      - MEDGEMMA_MODEL=${MEDGEMMA_MODEL}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        until ollama list > /dev/null 2>&1; do
          sleep 2
        done
        echo "Ollama is ready. Checking for model: ${MEDGEMMA_MODEL}..."
        if ollama list | grep -q "${MEDGEMMA_MODEL}"; then
          echo "Model '${MEDGEMMA_MODEL}' already available. Skipping download."
        else
          echo "Pulling model '${MEDGEMMA_MODEL}'. This may take a few minutes..."
          ollama pull ${MEDGEMMA_MODEL}
          echo "Model '${MEDGEMMA_MODEL}' ready!"
        fi
    depends_on:
      - ollama
    logging:
      driver: gcplogs
      options:
        labels: service=model-puller

  # ----------------------------------------------------------------
  # FastAPI backend
  # ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: action-platform-backend
    mem_limit: 1g    # FastAPI + Python deps; keeps RAM free for Ollama.
    expose:
      - "8000"
    environment:
      - OLLAMA_HOST=http://action-platform-ollama:11434
      - MEDGEMMA_MODEL=${MEDGEMMA_MODEL:-MedAIBase/MedGemma1.5:4b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: gcplogs
      options:
        gcp-log-cmd: "true"
        labels: service=backend

  # ----------------------------------------------------------------
  # Caddy - Reverse Proxy with automatic HTTPS (Let's Encrypt)
  # ----------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: action-platform-caddy
    mem_limit: 128m  # Reverse proxy — very low memory footprint.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: gcplogs
      options:
        labels: service=caddy

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
